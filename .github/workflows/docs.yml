name: Documentation website

# Builds the site from docs/ on every push (failing on broken links), and
# publishes it to GitHub Pages from the default branch.
on:
  push:
    branches:
      - "**"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/docs-requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r .github/docs-requirements.txt

      - name: Build (strict, fails on broken links)
        run: mkdocs build --strict

      - name: Upload site
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
