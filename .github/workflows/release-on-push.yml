name: Build and release every pushed commit

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-on-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    if: github.event.deleted == false

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_name: lmw-linux-x86_64
            executable_name: lmw
          - os: windows-latest
            platform: windows-x86_64
            binary_name: lmw-windows-x86_64
            executable_name: lmw.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Only needed for commits from before the Go rewrite.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pushed commits
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
          EXECUTABLE_NAME: ${{ matrix.executable_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          python - <<'PY' > "$RUNNER_TEMP/pushed-commits.txt"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          for commit in event.get("commits", []):
              commit_id = commit.get("id")
              if commit_id:
                  print(commit_id)
          PY
          if [ ! -s "$RUNNER_TEMP/pushed-commits.txt" ]; then
            printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pushed-commits.txt"
          fi

          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            SUFFIX=".exe"
          fi

          rm -rf release-assets
          mkdir -p release-assets

          COMMIT_INDEX=0

          while IFS= read -r COMMIT_SHA; do
            COMMIT_SHA="${COMMIT_SHA//$'\r'/}"
            if [ -z "$COMMIT_SHA" ]; then
              continue
            fi

            COMMIT_INDEX=$((COMMIT_INDEX + 1))
            OUTPUT_DIR="release-assets/${COMMIT_INDEX}"
            echo "::group::Build ${PLATFORM} commit ${COMMIT_INDEX} (${COMMIT_SHA:0:12})"
            git checkout --force "$COMMIT_SHA"
            rm -rf dist build

            if [ -f pyproject.toml ]; then
              # Python implementation (commits before the Go rewrite).
              KIND=python
              BASE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
              export PLAYWRIGHT_BROWSERS_PATH=0
              python -m pip install --upgrade pip
              python -m pip install -e ".[dev]"
              if [ "$RUNNER_OS" = "Linux" ]; then
                python -m playwright install --with-deps chromium
              else
                python -m playwright install chromium
              fi
              python -m pytest
              python scripts/build_binary.py --clean --skip-browser-install --name "$BINARY_NAME"
            else
              KIND=go
              BASE_VERSION="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
              go vet ./...
              go test ./...
              CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}${SUFFIX}" ./cmd/lmw
            fi

            if [ -z "$BASE_VERSION" ]; then
              echo "Could not read the version of commit ${COMMIT_SHA}" >&2
              exit 1
            fi

            mkdir -p "${OUTPUT_DIR}/${PLATFORM}"
            cp "dist/${BINARY_NAME}${SUFFIX}" "${OUTPUT_DIR}/${PLATFORM}/${EXECUTABLE_NAME}"
            chmod +x "${OUTPUT_DIR}/${PLATFORM}/${EXECUTABLE_NAME}"
            printf '%s\n' "$BASE_VERSION" > "${OUTPUT_DIR}/version.txt"
            printf '%s\n' "$KIND" > "${OUTPUT_DIR}/kind.txt"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/pushed-commits.txt"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/**
          if-no-files-found: error

  release:
    name: Create GitHub releases
    runs-on: ubuntu-latest
    needs: build
    if: github.event.deleted == false
    permissions:
      contents: write

    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release for each pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Only the default branch produces regular releases; other branches
          # produce prereleases so they never become the "Latest" release.
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi

          python - <<'PY' > "$RUNNER_TEMP/pushed-commits.txt"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          for commit in event.get("commits", []):
              commit_id = commit.get("id")
              if commit_id:
                  print(commit_id)
          PY
          if [ ! -s "$RUNNER_TEMP/pushed-commits.txt" ]; then
            printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pushed-commits.txt"
          fi

          COMMIT_INDEX=0

          while IFS= read -r COMMIT_SHA; do
            COMMIT_SHA="${COMMIT_SHA//$'\r'/}"
            if [ -z "$COMMIT_SHA" ]; then
              continue
            fi

            COMMIT_INDEX=$((COMMIT_INDEX + 1))
            ASSET_DIR="release-assets/${COMMIT_INDEX}"
            LINUX_ASSET="${ASSET_DIR}/linux-x86_64/lmw"
            WINDOWS_ASSET="${ASSET_DIR}/windows-x86_64/lmw.exe"

            if [ ! -f "$LINUX_ASSET" ] || [ ! -f "$WINDOWS_ASSET" ] || [ ! -f "${ASSET_DIR}/version.txt" ]; then
              echo "Missing release assets for commit ${COMMIT_INDEX} (${COMMIT_SHA})" >&2
              find release-assets -type f | sort >&2
              exit 1
            fi

            VERSION="v$(cat "${ASSET_DIR}/version.txt")-build.${GITHUB_RUN_NUMBER}.${COMMIT_INDEX}"
            KIND="$(cat "${ASSET_DIR}/kind.txt")"
            RELEASE_TAG="${VERSION}"
            RELEASE_TITLE="LinkedinMechaWarrior ${VERSION}"

            rm -rf upload-assets
            mkdir -p upload-assets
            cp "$LINUX_ASSET" upload-assets/lmw-linux
            cp "$WINDOWS_ASSET" upload-assets/lmw.exe

            if [ "$KIND" = "go" ]; then
              BUILD_NOTE="Static Go binary: no browser, Python or other runtime needed."
            else
              BUILD_NOTE="Built with PyInstaller; Playwright Chromium is bundled into the executable."
            fi

            NOTES_FILE="$(mktemp)"
            cat > "$NOTES_FILE" <<EOF
          Automated release \`${VERSION}\` for commit \`${COMMIT_SHA}\` on branch \`${BRANCH}\`.

          Assets:
          - \`lmw-linux\`
          - \`lmw.exe\`

          Notes:
          - ${BUILD_NOTE}
          - Sessions, credentials and other local data are not included.
          EOF

            if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" \
                --repo "$REPOSITORY" \
                --target "$COMMIT_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --prerelease="$PRERELEASE"
              gh release upload "$RELEASE_TAG" \
                upload-assets/lmw-linux \
                upload-assets/lmw.exe \
                --repo "$REPOSITORY" \
                --clobber
            else
              PRERELEASE_FLAG=()
              if [ "$PRERELEASE" = "true" ]; then
                PRERELEASE_FLAG=(--prerelease)
              fi
              gh release create "$RELEASE_TAG" \
                upload-assets/lmw-linux \
                upload-assets/lmw.exe \
                --repo "$REPOSITORY" \
                --target "$COMMIT_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                "${PRERELEASE_FLAG[@]}"
            fi
          done < "$RUNNER_TEMP/pushed-commits.txt"
