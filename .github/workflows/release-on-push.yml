name: Build and release every pushed commit

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-on-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    if: github.event.deleted == false

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_name: linkedin-cli-linux-x86_64
            executable_name: linkedin-cli
          - os: windows-latest
            platform: windows-x86_64
            binary_name: linkedin-cli-windows-x86_64
            executable_name: linkedin-cli.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        shell: bash
        run: python -m pip install --upgrade pip

      - name: Build pushed commits
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
          EXECUTABLE_NAME: ${{ matrix.executable_name }}
          PLATFORM: ${{ matrix.platform }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/pushed-commits.txt
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          for commit in event.get("commits", []):
              commit_id = commit.get("id")
              if commit_id:
                  print(commit_id)
          PY
          if [ ! -s /tmp/pushed-commits.txt ]; then
            printf '%s\n' "$GITHUB_SHA" > /tmp/pushed-commits.txt
          fi

          BASE_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"

          rm -rf release-assets
          mkdir -p release-assets

          COMMIT_INDEX=0

          while IFS= read -r COMMIT_SHA; do
            COMMIT_SHA="${COMMIT_SHA//$'\r'/}"
            if [ -z "$COMMIT_SHA" ]; then
              continue
            fi

            COMMIT_INDEX=$((COMMIT_INDEX + 1))
            SHORT_SHA="${COMMIT_SHA:0:12}"
            VERSION="v${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}.${COMMIT_INDEX}"
            OUTPUT_DIR="release-assets/${VERSION}/${PLATFORM}"

            echo "::group::Build ${PLATFORM} ${VERSION} ${SHORT_SHA}"
            git checkout --force "$COMMIT_SHA"

            python -m pip install -e ".[dev]"
            python -m pytest
            python scripts/build_binary.py --clean --name "$BINARY_NAME"

            mkdir -p "$OUTPUT_DIR"

            if [ "$RUNNER_OS" = "Windows" ]; then
              cp "dist/${BINARY_NAME}.exe" "${OUTPUT_DIR}/${EXECUTABLE_NAME}"
            else
              cp "dist/${BINARY_NAME}" "${OUTPUT_DIR}/${EXECUTABLE_NAME}"
              chmod +x "${OUTPUT_DIR}/${EXECUTABLE_NAME}"
            fi

            echo "::endgroup::"
          done < /tmp/pushed-commits.txt

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/**
          if-no-files-found: error

  release:
    name: Create GitHub releases
    runs-on: ubuntu-latest
    needs: build
    if: github.event.deleted == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release for each pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python - <<'PY' > /tmp/pushed-commits.txt
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          for commit in event.get("commits", []):
              commit_id = commit.get("id")
              if commit_id:
                  print(commit_id)
          PY
          if [ ! -s /tmp/pushed-commits.txt ]; then
            printf '%s\n' "$GITHUB_SHA" > /tmp/pushed-commits.txt
          fi

          BASE_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"

          COMMIT_INDEX=0

          while IFS= read -r COMMIT_SHA; do
            COMMIT_SHA="${COMMIT_SHA//$'\r'/}"
            if [ -z "$COMMIT_SHA" ]; then
              continue
            fi

            COMMIT_INDEX=$((COMMIT_INDEX + 1))
            SHORT_SHA="${COMMIT_SHA:0:12}"
            VERSION="v${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}.${COMMIT_INDEX}"
            RELEASE_TAG="${VERSION}"
            RELEASE_TITLE="LinkedIn CLI ${VERSION}"

            LINUX_ASSET="release-assets/${VERSION}/linux-x86_64/linkedin-cli"
            WINDOWS_ASSET="release-assets/${VERSION}/windows-x86_64/linkedin-cli.exe"

            if [ ! -f "$LINUX_ASSET" ] || [ ! -f "$WINDOWS_ASSET" ]; then
              echo "Missing release assets for ${VERSION} (${COMMIT_SHA})" >&2
              find release-assets -type f | sort >&2
              exit 1
            fi

            rm -rf upload-assets
            mkdir -p upload-assets
            cp "$LINUX_ASSET" upload-assets/linkedin-cli-linux
            cp "$WINDOWS_ASSET" upload-assets/linkedin-cli.exe

            NOTES_FILE="$(mktemp)"
            cat > "$NOTES_FILE" <<EOF
          Automated release \`${VERSION}\` for commit \`${COMMIT_SHA}\`.

          Assets:
          - \`linkedin-cli-linux\`
          - \`linkedin-cli.exe\`

          Notes:
          - Built with PyInstaller.
          - Browser commands require Playwright Chromium on the target machine.
          - Credentials, local profiles, .env files, and debug screenshots are not included.
          EOF

            if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" \
                --repo "$REPOSITORY" \
                --target "$COMMIT_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE"
              gh release upload "$RELEASE_TAG" \
                upload-assets/linkedin-cli-linux \
                upload-assets/linkedin-cli.exe \
                --repo "$REPOSITORY" \
                --clobber
            else
              gh release create "$RELEASE_TAG" \
                upload-assets/linkedin-cli-linux \
                upload-assets/linkedin-cli.exe \
                --repo "$REPOSITORY" \
                --target "$COMMIT_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE"
            fi
          done < /tmp/pushed-commits.txt
