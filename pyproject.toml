[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mecha-warrior"
version = "0.2.0"
description = "A command-line client for LinkedIn built on its internal API and a real browser session."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.6.0",
]
dev = [
    "pyinstaller>=6.6.0",
    "pytest>=8.2.0",
]

[project.scripts]
lmw = "lmw.cli:main"

[tool.setuptools.packages.find]
include = ["lmw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
