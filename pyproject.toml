[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mecha-warrior"
version = "0.1.0"
description = "Local LinkedIn drafting assistant with Playwright and human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
include = ["linkedin_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
