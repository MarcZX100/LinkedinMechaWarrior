[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mecha-warrior"
version = "0.1.0"
description = "Local LinkedIn drafting assistant with Playwright and human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.6.0",
]
dev = [
    "pyinstaller>=6.6.0",
    "pytest>=8.2.0",
]

[project.scripts]
linkedin-cli = "linkedin_automation.cli:main"

[tool.setuptools.packages.find]
include = ["linkedin_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
